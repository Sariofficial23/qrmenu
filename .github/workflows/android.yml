# Собирает приложение для Android (APK) и выкладывает его в Releases.
# Ссылка на скачивание всегда одна и та же:
#   https://github.com/Sariofficial23/qrmenu/releases/latest/download/Istanbul-Menu.apk
name: Android app

on:
  push:
    branches: [gh-pages]
    paths-ignore: ["print/**", "README.md", "qr.html"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copy menu into the app (offline copy)
        run: |
          WWW=android/app/src/main/assets/www
          mkdir -p "$WWW"
          cp index.html app.js styles.css menu.js manifest.webmanifest "$WWW"/
          cp -r icons fonts "$WWW"/
          if [ -d img ]; then cp -r img "$WWW"/; fi

      - name: Optional permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Istanbul-Menu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Istanbul-Menu
          path: Istanbul-Menu.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Istanbul Menu — приложение для планшета (v${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Istanbul-Menu.apk
          body: |
            Меню ресторана «Istanbul» для Android-планшета.
            Скачайте **Istanbul-Menu.apk** ниже и откройте файл на планшете.
