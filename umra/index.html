<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umra Consulting — Umra uchun eng ishonchli variantni tanlang</title>
<meta name="description" content="Litsenziyali turfirmalarning barcha Umra tariflari bitta ofisda. Mijozdan komissiya olmaymiz.">
<meta name="theme-color" content="#0e0b07">
<meta property="og:title" content="Umra Consulting">
<meta property="og:description" content="Umra uchun eng ishonchli variant — bitta ofisda. Mijozdan komissiya olmaymiz.">
<meta property="og:image" content="assets/logo-square.jpg">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="i18n.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
  <symbol id="i-tg" viewBox="0 0 24 24"><path fill="currentColor" d="M21.4 4.3 2.9 11.4c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.3-.5-1.9-1.4-1.5zM9.1 14.2l9-5.7c.4-.3.8-.1.5.2l-7.5 6.8-.3 3.2z"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 3 2 20h20zM12 10v4M12 17h.01"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M12 7v5l3 2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6zM8.5 12l2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9C10 5 6.5 5 7 7.5S12 9 12 9s4-.5 5-1.5S14 5 12 9"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/></symbol>
</svg>

<header class="nav" id="nav">
  <div class="nav__in">
    <a href="#top" class="logo" aria-label="Umra Consulting"><img src="assets/logo-wide.png" alt="Umra Consulting" width="900" height="323"></a>
    <nav class="nav__links" aria-label="Menu">
      <a href="#why" data-t="nav.why"></a>
      <a href="#how" data-t="nav.how"></a>
      <a href="#tariffs" data-t="nav.tariffs"></a>
      <a href="#faq" data-t="nav.faq"></a>
      <a href="#lead" data-t="nav.contact"></a>
    </nav>
    <div class="nav__right">
      <div class="lang" role="group" aria-label="Til / Язык"><button type="button" data-lang="uz">UZ</button><button type="button" data-lang="ru">RU</button></div>
      <a class="phone-pill" data-phone-link href="#"><svg><use href="#i-phone"/></svg><span data-phone></span></a>
      <a class="btn btn--gold btn--sm" href="#lead" data-t="cta.contact"></a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="wrap hero__grid">
      <div class="hero__text">
        <span class="pill reveal"><i></i><span data-t="hero.pill"></span></span>
        <h1 class="reveal" data-t="hero.h1"></h1>
        <p class="lead reveal" data-t="hero.lead"></p>
        <div class="hero__cta reveal">
          <a class="btn btn--gold" href="#lead"><svg><use href="#i-tg"/></svg><span data-t="hero.cta1"></span></a>
          <a class="btn btn--light" data-phone-link href="#"><svg><use href="#i-phone"/></svg><span data-t="hero.cta2"></span></a>
        </div>
        <div class="stats reveal">
          <div><b data-t="st1.b"></b><small data-t="st1.s"></small></div>
          <div><b data-t="st2.b"></b><small data-t="st2.s"></small></div>
          <div><b data-t="st3.b"></b><small data-t="st3.s"></small></div>
        </div>
      </div>
      <div class="hero__emblem reveal" aria-hidden="true">
        <div class="emblem">
          <video autoplay muted playsinline preload="auto" poster="assets/intro-poster.jpg" id="intro"><source src="assets/intro.mp4" type="video/mp4"></video>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="problem">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="prob.eye"></p>
      <h2 class="reveal" data-t="prob.h2"></h2>
      <div class="grid4">
        <div class="card card--warn reveal"><span class="ico"><svg><use href="#i-alert"/></svg></span><h3 data-t="p1.h"></h3><p data-t="p1.p"></p></div>
        <div class="card card--warn reveal"><span class="ico"><svg><use href="#i-users"/></svg></span><h3 data-t="p2.h"></h3><p data-t="p2.p"></p></div>
        <div class="card card--warn reveal"><span class="ico"><svg><use href="#i-doc"/></svg></span><h3 data-t="p3.h"></h3><p data-t="p3.p"></p></div>
        <div class="card card--warn reveal"><span class="ico"><svg><use href="#i-clock"/></svg></span><h3 data-t="p4.h"></h3><p data-t="p4.p"></p></div>
      </div>
    </div>
  </section>

  <section class="section section--alt" id="why">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="why.eye"></p>
      <h2 class="reveal" data-t="why.h2"></h2>
      <div class="grid4">
        <div class="card reveal"><span class="ico ico--gold"><svg><use href="#i-shield"/></svg></span><h3 data-t="w1.h"></h3><p data-t="w1.p"></p></div>
        <div class="card reveal"><span class="ico ico--gold"><svg><use href="#i-gift"/></svg></span><h3 data-t="w2.h"></h3><p data-t="w2.p"></p></div>
        <div class="card reveal"><span class="ico ico--gold"><svg><use href="#i-scale"/></svg></span><h3 data-t="w3.h"></h3><p data-t="w3.p"></p></div>
        <div class="card reveal"><span class="ico ico--gold"><svg><use href="#i-pen"/></svg></span><h3 data-t="w4.h"></h3><p data-t="w4.p"></p></div>
      </div>
    </div>
  </section>

  <section class="section" id="how">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="how.eye"></p>
      <h2 class="reveal" data-t="how.h2"></h2>
      <ol class="steps">
        <li class="reveal"><span>01</span><h3 data-t="s1.h"></h3><p data-t="s1.p"></p></li>
        <li class="reveal"><span>02</span><h3 data-t="s2.h"></h3><p data-t="s2.p"></p></li>
        <li class="reveal"><span>03</span><h3 data-t="s3.h"></h3><p data-t="s3.p"></p></li>
        <li class="reveal"><span>04</span><h3 data-t="s4.h"></h3><p data-t="s4.p"></p></li>
      </ol>
    </div>
  </section>

  <section class="section section--alt" id="tariffs">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="tar.eye"></p>
      <h2 class="reveal" data-t="tar.h2"></h2>
      <div class="tariffs">
        <article class="tariff reveal">
          <h3 data-t="t1.n"></h3><p class="tariff__d" data-t="t1.d"></p>
          <ul><li><svg><use href="#i-check"/></svg><span data-t="t1.l1"></span></li><li><svg><use href="#i-check"/></svg><span data-t="t1.l2"></span></li><li><svg><use href="#i-check"/></svg><span data-t="t1.l3"></span></li></ul>
          <a class="btn btn--line" href="#lead" data-pick="eco"><span data-t="tar.btn"></span><svg><use href="#i-arrow"/></svg></a>
        </article>
        <article class="tariff tariff--main reveal">
          <span class="badge" data-t="t2.badge"></span>
          <h3 data-t="t2.n"></h3><p class="tariff__d" data-t="t2.d"></p>
          <ul><li><svg><use href="#i-check"/></svg><span data-t="t2.l1"></span></li><li><svg><use href="#i-check"/></svg><span data-t="t2.l2"></span></li><li><svg><use href="#i-check"/></svg><span data-t="t2.l3"></span></li></ul>
          <a class="btn btn--gold" href="#lead" data-pick="std"><span data-t="tar.btn"></span><svg><use href="#i-arrow"/></svg></a>
        </article>
        <article class="tariff reveal">
          <h3 data-t="t3.n"></h3><p class="tariff__d" data-t="t3.d"></p>
          <ul><li><svg><use href="#i-check"/></svg><span data-t="t3.l1"></span></li><li><svg><use href="#i-check"/></svg><span data-t="t3.l2"></span></li><li><svg><use href="#i-check"/></svg><span data-t="t3.l3"></span></li></ul>
          <a class="btn btn--line" href="#lead" data-pick="prem"><span data-t="tar.btn"></span><svg><use href="#i-arrow"/></svg></a>
        </article>
      </div>
      <p class="note reveal" data-t="tar.note"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="trust reveal">
        <span class="trust__zero">0%</span>
        <div><h2 data-t="trust.h"></h2><p data-t="trust.p"></p></div>
      </div>
    </div>
  </section>

  <section class="section section--alt" id="faq">
    <div class="wrap wrap--narrow">
      <p class="eyebrow reveal" data-t="faq.eye"></p>
      <h2 class="reveal" data-t="faq.h2"></h2>
      <div class="faq">
        <details class="reveal"><summary data-t="q1"></summary><p data-t="a1"></p></details>
        <details class="reveal"><summary data-t="q2"></summary><p data-t="a2"></p></details>
        <details class="reveal"><summary data-t="q3"></summary><p data-t="a3"></p></details>
        <details class="reveal"><summary data-t="q4"></summary><p data-t="a4"></p></details>
        <details class="reveal"><summary data-t="q5"></summary><p data-t="a5"></p></details>
      </div>
    </div>
  </section>

  <section class="section" id="lead">
    <div class="wrap">
      <div class="lead-card reveal">
        <div class="lead-card__info">
          <p class="eyebrow" data-t="lead.eye"></p>
          <h2 data-t="lead.h2"></h2>
          <p data-t="lead.p"></p>
          <div class="contacts">
            <a data-phone-link href="#"><span class="ico ico--gold"><svg><use href="#i-phone"/></svg></span><span data-phone></span></a>
            <a data-tg-link href="#" target="_blank" rel="noopener"><span class="ico ico--gold"><svg><use href="#i-tg"/></svg></span><span data-tg-handle></span></a>
            <a data-ig-link href="#" target="_blank" rel="noopener"><span class="ico ico--gold"><svg><use href="#i-ig"/></svg></span><span data-ig-handle></span></a>
          </div>
        </div>
        <form class="form" id="form" novalidate>
          <fieldset class="seg">
            <legend data-t="f.legend"></legend>
            <label><input type="radio" name="tariff" value="eco"><span data-t="o.eco"></span></label>
            <label><input type="radio" name="tariff" value="std" checked><span data-t="o.std"></span></label>
            <label><input type="radio" name="tariff" value="prem"><span data-t="o.prem"></span></label>
            <label><input type="radio" name="tariff" value="unk"><span data-t="o.unk"></span></label>
          </fieldset>
          <label class="field"><span data-t="f.name"></span><input name="name" autocomplete="name" data-tp="f.name.ph" maxlength="80"></label>
          <label class="field"><span data-t="f.phone"></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998 __ ___ __ __" required maxlength="25"></label>
          <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn btn--gold btn--block" type="submit"><span data-t="f.submit"></span><svg><use href="#i-arrow"/></svg></button>
          <p class="form__note" id="formNote" role="status" aria-live="polite" data-t="f.note"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <img src="assets/logo-wide.png" alt="Umra Consulting" class="footer__logo" width="900" height="323" loading="lazy">
    <p><span data-t="foot.tag"></span> · <span data-city></span></p>
    <small>© <span id="year"></span> Umra Consulting</small>
  </div>
</footer>

<div class="mbar" id="mbar">
  <a class="btn btn--light" data-phone-link href="#" aria-label="Call"><svg><use href="#i-phone"/></svg></a>
  <a class="btn btn--gold btn--block" href="#lead" data-t="hero.cta1"></a>
</div>

<script src="main.js"></script>
</body>
</html>
