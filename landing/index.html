<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Hizmatlar — Telegram-botlar, saytlar va biznesni avtomatlashtirish</title>
<meta name="description" content="Sun'iy intellektli Telegram-botlar, yetkazib berish botlari, lendinglar hamda kafe va restoranlar uchun avtomatlashtirish tizimlari.">
<meta name="theme-color" content="#f5f5f7">
<meta property="og:title" content="Botlar, saytlar va avtomatlashtirish — siz uchun ishlaydi">
<meta property="og:description" content="Telegram-botlar, lendinglar va restoranlar uchun avtomatlashtirish. Telegram-боты, сайты и автоматизация.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="previews.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#0a5cff"/></linearGradient>
    <linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#5e2bff"/></linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcc00"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
    <linearGradient id="g-ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient>
  </defs>
  <symbol id="i-bot" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3v3M8 21h8M5 9a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM9.5 12h.01M14.5 12h.01M2 12v2M22 12v2"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 9h18M6.5 6.5h.01M9 6.5h.01M7 13h6M7 16h10"/></symbol>
  <symbol id="i-cafe" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3M3 21h14"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-tg" viewBox="0 0 24 24"><path fill="currentColor" d="M21.4 4.3 2.9 11.4c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.3-.5-1.9-1.4-1.5zM9.1 14.2l9-5.7c.4-.3.8-.1.5.2l-7.5 6.8-.3 3.2z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 6h11v10H3zM14 10h4l3 3v3h-7M7.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
</svg>

<header class="nav" id="nav">
  <div class="nav__in">
    <a href="#top" class="logo"><span class="logo__mark"><svg><use href="#i-spark"/></svg></span><span data-brand></span></a>
    <nav class="nav__links" aria-label="Menu">
      <a href="#services" data-t="nav.services"></a>
      <a href="#restaurants" data-t="nav.rest"></a>
      <a href="#work" data-t="nav.work"></a>
      <a href="#process" data-t="nav.process"></a>
      <a href="#faq" data-t="nav.faq"></a>
    </nav>
    <div class="nav__right">
      <div class="lang" role="group" aria-label="Til / Язык">
        <button type="button" data-lang="uz">UZ</button><button type="button" data-lang="ru">RU</button>
      </div>
      <a class="icon-btn" data-ig-link href="#" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-ig"/></svg></a>
      <a class="btn btn--sm btn--dark" href="#lead" data-t="cta.lead"></a>
    </div>
  </div>
</header>

<main id="top">

  <!-- ПЕРВЫЙ ЭКРАН -->
  <section class="hero">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="wrap hero__grid">
      <div class="hero__text">
        <span class="pill reveal"><svg><use href="#i-spark"/></svg> <span data-t="hero.pill"></span></span>
        <h1 class="reveal" data-t="hero.h1"></h1>
        <p class="lead reveal" data-t="hero.lead"></p>

        <div class="chips reveal" role="list">
          <a role="listitem" class="chip" href="#lead" data-pick="bot"><span class="sticker sticker--blue"><svg><use href="#i-bot"/></svg></span><span><b data-t="chip.bot.t"></b><small data-t="chip.bot.s"></small></span></a>
          <a role="listitem" class="chip" href="#lead" data-pick="site"><span class="sticker sticker--violet"><svg><use href="#i-web"/></svg></span><span><b data-t="chip.site.t"></b><small data-t="chip.site.s"></small></span></a>
          <a role="listitem" class="chip" href="#lead" data-pick="auto"><span class="sticker sticker--orange"><svg><use href="#i-cafe"/></svg></span><span><b data-t="chip.auto.t"></b><small data-t="chip.auto.s"></small></span></a>
        </div>

        <div class="hero__cta reveal">
          <a class="btn btn--primary" href="#lead"><span data-t="hero.cta1"></span> <svg><use href="#i-arrow"/></svg></a>
          <a class="btn btn--ghost" href="#work" data-t="hero.cta2"></a>
        </div>
      </div>

      <div class="hero__visual reveal" aria-hidden="true">
        <div class="phone">
          <div class="phone__notch"></div>
          <div class="chat">
            <div class="chat__head"><span class="chat__ava"><svg><use href="#i-bot"/></svg></span><div><b>Delivery Bot</b><small data-t="chat.status"></small></div></div>
            <div class="chat__body" id="chat"></div>
          </div>
        </div>
        <div class="float float--a"><span class="sticker sticker--orange"><svg><use href="#i-bell"/></svg></span><div><b data-t="float.a.t"></b><small data-t="float.a.s"></small></div></div>
        <div class="float float--b"><span class="sticker sticker--blue"><svg><use href="#i-chart"/></svg></span><div><b data-t="float.b.t"></b><small class="up" data-t="float.b.s"></small></div></div>
      </div>
    </div>
  </section>

  <!-- Цифры (из config.js) -->
  <section class="facts wrap" id="stats"></section>

  <!-- УСЛУГИ -->
  <section class="section" id="services">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="services.eye"></p>
      <h2 class="reveal" data-t="services.h2"></h2>

      <div class="bento">
        <article class="card card--bot reveal">
          <span class="sticker sticker--lg sticker--blue"><svg><use href="#i-bot"/></svg></span>
          <h3 data-t="bot.h"></h3>
          <p data-t="bot.p"></p>
          <ul class="ticks">
            <li><svg><use href="#i-check"/></svg><span data-t="bot.l1"></span></li>
            <li><svg><use href="#i-check"/></svg><span data-t="bot.l2"></span></li>
            <li><svg><use href="#i-check"/></svg><span data-t="bot.l3"></span></li>
            <li><svg><use href="#i-check"/></svg><span data-t="bot.l4"></span></li>
          </ul>
          <a class="btn btn--dark" href="#lead" data-pick="bot"><span data-t="bot.btn"></span> <svg><use href="#i-arrow"/></svg></a>
        </article>

        <article class="card card--site reveal">
          <span class="sticker sticker--lg sticker--violet"><svg><use href="#i-web"/></svg></span>
          <h3 data-t="site.h"></h3>
          <p data-t="site.p"></p>
          <ul class="ticks">
            <li><svg><use href="#i-check"/></svg><span data-t="site.l1"></span></li>
            <li><svg><use href="#i-check"/></svg><span data-t="site.l2"></span></li>
            <li><svg><use href="#i-check"/></svg><span data-t="site.l3"></span></li>
          </ul>
          <a class="btn btn--dark" href="#lead" data-pick="site"><span data-t="site.btn"></span> <svg><use href="#i-arrow"/></svg></a>
        </article>

        <article class="card card--auto reveal">
          <span class="sticker sticker--lg sticker--orange"><svg><use href="#i-cafe"/></svg></span>
          <h3 data-t="auto.h"></h3>
          <p data-t="auto.p"></p>
          <ul class="ticks">
            <li><svg><use href="#i-check"/></svg><span data-t="auto.l1"></span></li>
            <li><svg><use href="#i-check"/></svg><span data-t="auto.l2"></span></li>
          </ul>
          <a class="btn btn--dark" href="#lead" data-pick="auto"><span data-t="auto.btn"></span> <svg><use href="#i-arrow"/></svg></a>
        </article>
      </div>
    </div>
  </section>

  <!-- ДЛЯ РЕСТОРАНОВ -->
  <section class="section dark" id="restaurants">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="rest.eye"></p>
      <h2 class="reveal" data-t="rest.h2"></h2>
      <p class="lead lead--dark reveal" data-t="rest.lead"></p>

      <div class="feat">
        <div class="feat__item reveal"><span class="sticker sticker--orange"><svg><use href="#i-qr"/></svg></span><h4 data-t="f1.h"></h4><p data-t="f1.p"></p></div>
        <div class="feat__item reveal"><span class="sticker sticker--blue"><svg><use href="#i-truck"/></svg></span><h4 data-t="f2.h"></h4><p data-t="f2.p"></p></div>
        <div class="feat__item reveal"><span class="sticker sticker--violet"><svg><use href="#i-bell"/></svg></span><h4 data-t="f3.h"></h4><p data-t="f3.p"></p></div>
        <div class="feat__item reveal"><span class="sticker sticker--orange"><svg><use href="#i-chart"/></svg></span><h4 data-t="f4.h"></h4><p data-t="f4.p"></p></div>
      </div>

      <div class="demo reveal">
        <div>
          <b data-t="demo.t"></b>
          <span data-t="demo.s"></span>
        </div>
        <a class="btn btn--light" href="https://sariofficial23.github.io/qrmenu/" target="_blank" rel="noopener"><span data-t="demo.btn"></span> <svg><use href="#i-arrow"/></svg></a>
      </div>
    </div>
  </section>

  <!-- РАБОТЫ (из config.js) -->
  <section class="section" id="work">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="work.eye"></p>
      <h2 class="reveal" data-t="work.h2"></h2>
      <div class="works" id="works"></div>
    </div>
  </section>

  <!-- ПРОЦЕСС -->
  <section class="section section--soft" id="process">
    <div class="wrap">
      <p class="eyebrow reveal" data-t="proc.eye"></p>
      <h2 class="reveal" data-t="proc.h2"></h2>
      <ol class="steps">
        <li class="reveal"><span>01</span><h4 data-t="s1.h"></h4><p data-t="s1.p"></p></li>
        <li class="reveal"><span>02</span><h4 data-t="s2.h"></h4><p data-t="s2.p"></p></li>
        <li class="reveal"><span>03</span><h4 data-t="s3.h"></h4><p data-t="s3.p"></p></li>
        <li class="reveal"><span>04</span><h4 data-t="s4.h"></h4><p data-t="s4.p"></p></li>
      </ol>
    </div>
  </section>

  <!-- INSTAGRAM -->
  <section class="section">
    <div class="wrap">
      <a class="insta reveal" data-ig-link href="#" target="_blank" rel="noopener">
        <span class="insta__icon"><svg><use href="#i-ig"/></svg></span>
        <span class="insta__text">
          <small data-t="ig.small"></small>
          <b data-ig-handle></b>
          <span data-t="ig.p"></span>
        </span>
        <span class="btn btn--light"><span data-t="ig.btn"></span> <svg><use href="#i-arrow"/></svg></span>
      </a>
    </div>
  </section>

  <!-- FAQ -->
  <section class="section section--soft" id="faq">
    <div class="wrap wrap--narrow">
      <p class="eyebrow reveal" data-t="faq.eye"></p>
      <h2 class="reveal" data-t="faq.h2"></h2>
      <div class="faq">
        <details class="reveal"><summary data-t="q1"></summary><p data-t="a1"></p></details>
        <details class="reveal"><summary data-t="q2"></summary><p data-t="a2"></p></details>
        <details class="reveal"><summary data-t="q3"></summary><p data-t="a3"></p></details>
        <details class="reveal"><summary data-t="q4"></summary><p data-t="a4"></p></details>
        <details class="reveal"><summary data-t="q5"></summary><p data-t="a5"></p></details>
      </div>
    </div>
  </section>

  <!-- ЗАЯВКА -->
  <section class="section" id="lead">
    <div class="wrap">
      <div class="lead-card reveal">
        <div class="lead-card__info">
          <p class="eyebrow" data-t="lead.eye"></p>
          <h2 data-t="lead.h2"></h2>
          <p data-t="lead.p"></p>
          <div class="contacts">
            <a data-tg-link href="#" target="_blank" rel="noopener"><span class="sticker sticker--blue"><svg><use href="#i-tg"/></svg></span><span data-tg-handle></span></a>
            <a data-phone-link href="#"><span class="sticker sticker--violet"><svg><use href="#i-phone"/></svg></span><span data-phone></span></a>
            <a data-ig-link href="#" target="_blank" rel="noopener"><span class="sticker sticker--ig"><svg><use href="#i-ig"/></svg></span><span data-ig-handle></span></a>
          </div>
        </div>

        <form class="form" id="form" novalidate>
          <fieldset class="seg">
            <legend data-t="form.legend"></legend>
            <label><input type="radio" name="service" value="bot" checked><span><svg><use href="#i-bot"/></svg><i data-t="opt.bot"></i></span></label>
            <label><input type="radio" name="service" value="site"><span><svg><use href="#i-web"/></svg><i data-t="opt.site"></i></span></label>
            <label><input type="radio" name="service" value="auto"><span><svg><use href="#i-cafe"/></svg><i data-t="opt.auto"></i></span></label>
            <label><input type="radio" name="service" value="other"><span><svg><use href="#i-spark"/></svg><i data-t="opt.other"></i></span></label>
          </fieldset>

          <label class="field"><span data-t="f.name"></span><input name="name" autocomplete="name" data-tp="f.name.ph" maxlength="80"></label>
          <label class="field"><span data-t="f.phone"></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998 __ ___ __ __" required maxlength="25"></label>
          <label class="field"><span data-t="f.tg"></span><input name="telegram" autocomplete="off" data-tp="f.tg.ph" maxlength="40"></label>
          <label class="field"><span data-t="f.msg"></span><textarea name="message" rows="3" data-tp="f.msg.ph" maxlength="1000"></textarea></label>
          <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

          <button class="btn btn--primary btn--block" type="submit"><span data-t="form.submit"></span> <svg><use href="#i-arrow"/></svg></button>
          <p class="form__note" id="formNote" role="status" aria-live="polite" data-t="form.note"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <a href="#top" class="logo"><span class="logo__mark"><svg><use href="#i-spark"/></svg></span><span data-brand></span></a>
    <p><span data-t="footer.tag"></span> · <span data-city></span></p>
    <div class="footer__soc">
      <a class="icon-btn" data-ig-link href="#" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-ig"/></svg></a>
      <a class="icon-btn" data-tg-link href="#" target="_blank" rel="noopener" aria-label="Telegram"><svg><use href="#i-tg"/></svg></a>
    </div>
    <small>© <span id="year"></span> <span data-brand></span></small>
  </div>
</footer>

<div class="mbar" id="mbar">
  <a class="icon-btn icon-btn--light" data-ig-link href="#" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-ig"/></svg></a>
  <a class="btn btn--primary btn--block" href="#lead" data-t="cta.lead"></a>
</div>

<script src="main.js"></script>
</body>
</html>
